[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-hospital-mcp"
version = "0.2.0"
description = "MCP adapter for the Pet Hospital REST API"
requires-python = ">=3.11"
dependencies = ["mcp==2.0.0", "httpx>=0.27,<1", "pydantic>=2.7,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
pet-hospital-mcp = "pet_hospital_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"